[tool.poetry]
name = "ocpp-server"
version = "1.0.0"
description = "Server OCPP 1.6J con persistenza PostgreSQL."
authors = ["OCPP Server"]
readme = "README.md"
packages = [{ include = "ocpp" }]

[tool.poetry.dependencies]
python = "^3.11"
jsonschema = "^4.23.0"
asyncpg = "^0.31.0"
websockets = "^17.0"
python-dotenv = "^1.2.2"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
